# Example overrides: copy to ~/.futurecast/config/assets.yaml to use (this repo copy is not read).

# Set per coin at runtime for the residual-alpha engine; these defaults only serve tests
target_asset: "DOGEUSDT"
benchmark_assets:
  - "BTCUSDT"
  - "ETHUSDT"

# Data source (strictly public read-only endpoints, no authentication required)
data_source:
  base_url: "https://fapi.binance.com"
  request_timeout_sec: 15
  max_retries: 3

storage:
  cache_dir: "cache"  # downloaded candles go in <cache_dir>/candles
  use_cache: true
