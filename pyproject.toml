[project]
name = "futurecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohan Biswas", email = "imrohan550@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
futurecast = "futurecast:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
