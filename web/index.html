<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>FutureCast · Risk Watchlist</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme (or the OS preference) before first paint so the page never flashes.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("fc-theme"); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : (prefersDark ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div id="app" class="contents"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
