[tools]
node = "24"

[env]
# Development ports: the page (vite) and the backend it proxies /api and /ws to
FUTURECAST_WEB_PORT = "{{ get_env(name='FUTURECAST_WEB_PORT', default='5000') }}"
FUTURECAST_API_PORT = "{{ get_env(name='FUTURECAST_API_PORT', default='5001') }}"

[tasks.install]
description = "Install the Python and frontend dependencies"
depends = ["install:web"]
run = "uv sync"

[tasks."install:web"]
description = "Install the frontend's npm packages (skipped while package-lock.json is unchanged)"
dir = "web"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Svelte dev server on http://localhost:5000 (hot reload) and the backend on :5001"
depends = ["dev:api", "dev:web"]

[tasks."dev:api"]
description = "FastAPI backend only (extra arguments pass through, e.g. --offline)"
run = "uv run futurecast --host 127.0.0.1 --port $FUTURECAST_API_PORT"

[tasks."dev:web"]
description = "Svelte dev server only, proxying /api and /ws to the backend"
depends = ["install:web"]
dir = "web"
run = "npm run dev"

[tasks.build]
description = "Build the frontend into web/dist, which the backend serves"
depends = ["install:web"]
dir = "web"
run = "npm run build"

[tasks.start]
description = "Build the frontend and serve the dashboard on :8000 like ./run.sh"
depends = ["build"]
run = "./run.sh"

[tasks.check]
description = "Type-check the frontend"
depends = ["install:web"]
dir = "web"
run = "npm run check"

[tasks.test]
description = "Python test suite"
run = "uv run pytest -q"
