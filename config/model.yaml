# LightGBM Model & Walk-Forward Validation Configuration

lightgbm:
  objective: "regression_l1"
  metric: "rmse"
  boosting_type: "gbdt"
  learning_rate: 0.015
  num_leaves: 31
  max_depth: 5
  min_child_samples: 250
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.7
  reg_alpha: 0.1
  reg_lambda: 1.0
  n_estimators: 1500
  n_jobs: -1
  verbose: -1
  early_stopping_rounds: 50

validation:
  train_window_days: 120    # ~4 months rolling
  test_window_days: 30      # 1 month test
  step_window_days: 30      # 1 month step forward
  purge_window_minutes: 60  # Purge final 60m before test
  embargo_window_minutes: 1440 # 24h embargo after test
  min_acceptable_ic: 0.03

optuna:
  n_trials: 40
  timeout_seconds: 3600
  study_name: "lightgbm_residual_alpha"

forecasting:
  zscore_window_minutes: 1440
  signal_threshold_z: 1.5
  output_dir: "logs/forecasts"
  air_gapped: true
  execution_enabled: false   # Strict safety flag: MUST BE FALSE
