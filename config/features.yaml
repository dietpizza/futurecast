# Example overrides: copy to ~/.futurecast/config/features.yaml to use (this repo copy is not read).
# Windows named *_min count candles of the interval being modelled, except funding_ema_window_min (clock minutes).
cross_asset:
  horizons_min: [1, 5, 15, 60]
  beta_windows_min: [60, 1440]
  rsi_period: 14

microstructure:
  volume_z_windows_min: [60, 1440]
  rvr_window_min: 15
  parkinson_windows_min: [15, 60, 240]

derivatives:
  funding_ema_window_min: 4320  # trailing funding-rate mean: 3 days of clock time (minutes, not candles)

technical:
  stochastic_extremes_window_min: 60
  vwap_window_min: 240  # 4 hours of 1m candles

# Residual-alpha target (secondary model)
target:
  horizon_min: 15
